site_name: Modding Wiki
site_description: >-
  The single wiki for every Cobblemon mod by shiero — Routes, Nuzlocke & Soul Link, Picnic and Ditto HMs.
site_url: https://manucruzleiva.github.io/mod-wiki/
repo_url: https://github.com/manucruzleiva/mod-wiki
repo_name: manucruzleiva/mod-wiki
docs_dir: docs
copyright: 'Mods by shiero — "If you make money, I make money" license'

# The docs LIVE here — one site, one build, one repo.
#
# They used to live in each mod's repo and get deposited into a subdirectory of this repo's gh-pages
# branch by four separate workflows, each with its own deploy key. That is gone: the sources moved here,
# so there is a single mkdocs build and no cross-repo plumbing at all.
#
# It also matters that this repo is PUBLIC while every mod repo is private: the documentation stays
# openly readable and editable without exposing any code.

theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Every mod section follows the SAME spine, in this order:
#
#   index → Getting Started → (feature pages, mod-specific) → Commands → Configuration
#         → Reporting Bugs & Ideas → Roadmap → Community Credits → License
#
# Only the feature-page block differs between mods. Labels are fixed too — it was
# "Installation"/"Getting Started" and "World Creation & Config"/"Configuration" and
# "Reporting Bugs & Ideas"/"...& Features" across sections, which made the sidebar read as four
# unrelated sites. Keep a new mod's section to this shape.
nav:
  - Home: index.md
  - Cobblemon Routes:
      - routes/index.md
      - Getting Started: routes/getting-started.md
      - Dynamic Routes: routes/routes.md
      - Map Integration: routes/map-integration.md
      - Items & Recipes: routes/items.md
      - Gen2 Structures: routes/gen2-structures.md
      - Commands: routes/commands.md
      - Configuration: routes/configuration.md
      - Reporting Bugs & Ideas: routes/reporting.md
      - Roadmap: routes/roadmap.md
      - Community Credits: routes/credits.md
      - License: routes/license.md
  - Cobblemon Nuzlocke & Soul Link:
      - nuzlocke/index.md
      - Hardcore Nuzlocke: nuzlocke/nuzlocke.md
      - Soul Link (co-op): nuzlocke/soullock.md
      - Commands: nuzlocke/commands.md
      - Configuration: nuzlocke/configuration.md
      - Reporting Bugs & Ideas: nuzlocke/reporting.md
      - Roadmap: nuzlocke/roadmap.md
      - Community Credits: nuzlocke/credits.md
      - License: nuzlocke/license.md
  - Cobblemon Picnic:
      - picnic/index.md
      - Getting Started: picnic/getting-started.md
      - Picnic Tables: picnic/picnic-tables.md
      - Spawn Re-rolling: picnic/spawn-rerolling.md
      - Shiny Aura: picnic/shiny-aura.md
      - Interactions & Items: picnic/interactions-and-items.md
      - Battle Seeker: picnic/battle-seeker.md
      - Commands: picnic/commands.md
      - Configuration: picnic/configuration.md
      - FAQ: picnic/faq.md
      - Reporting Bugs & Ideas: picnic/reporting.md
      - Roadmap: picnic/roadmap.md
      - Community Credits: picnic/credits.md
      - License: picnic/license.md
  - Cobblemon Ditto HMs:
      - ditto-hms/index.md
      - Getting Started: ditto-hms/getting-started.md
      - Active HMs: ditto-hms/abilities/active.md
      - Toggle HMs: ditto-hms/abilities/toggles.md
      - HM Case: ditto-hms/hm-case.md
      - Commands: ditto-hms/commands.md
      - Configuration: ditto-hms/configuration.md
      - Reporting Bugs & Ideas: ditto-hms/reporting.md
      - Roadmap: ditto-hms/roadmap.md
      - Changelog: ditto-hms/changelog.md
      - Community Credits: ditto-hms/credits.md
      - License: ditto-hms/license.md
  - 💛 Sponsor shiero: https://github.com/sponsors/manucruzleiva

plugins:
  - search
