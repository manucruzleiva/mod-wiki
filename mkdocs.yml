site_name: Modding Wiki
site_description: >-
  The single wiki for every Cobblemon mod by shiero — Routes, Nuzlocke & Soul Link, Picnic and Ditto HMs.
site_url: https://manucruzleiva.github.io/mod-wiki/
repo_url: https://github.com/manucruzleiva/mod-wiki
repo_name: manucruzleiva/mod-wiki
docs_dir: docs
copyright: 'Mods by shiero — "If you make money, I make money" license'

# This repo builds ONLY the landing page (the site root). Each mod publishes its own wiki from
# its own repo, into its own subdirectory of the gh-pages branch:
#
#   /            <- this repo           (landing)
#   /routes/     <- manucruzleiva/routes
#   /picnic/     <- manucruzleiva/cobblemon-picnic
#   /ditto-hms/  <- manucruzleiva/cobblemon-ditto-hms
#   /nuzlocke/   <- pending the split  (#122)
#
# That is why the nav below uses absolute links to those subdirectories rather than local pages:
# mkdocs does not know those files — each mod drops them in when it deploys.

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Cobblemon Routes: /mod-wiki/routes/
  - Cobblemon Picnic: /mod-wiki/picnic/
  - Cobblemon Ditto HMs: /mod-wiki/ditto-hms/
  - 💛 Sponsor shiero: https://github.com/sponsors/manucruzleiva

plugins:
  - search
