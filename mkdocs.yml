site_name: Modding Wiki
site_description: >-
  The single wiki for every Cobblemon mod by shiero — Routes, Nuzlocke & Soul Link, Picnic, Ditto HMs,
  Raid Icons, Champions Training and Mid-Battle EXP.
site_url: https://manucruzleiva.github.io/mod-wiki/
INHERIT: mkdocs.base.yml

# EL SITIO COMBINADO: todos los mods en un solo build, que es lo que publica deploy.yml hasta que
# el deploy pase a mike, un sitio por mod (#39). Ese ticket borra este archivo.

# Every mod section follows the SAME spine, in this order:
#
#   index → Getting Started → (feature pages, mod-specific) → Commands → Configuration
#         → Community Credits
#
# Sin Roadmap: cuatro paginas de "lo que viene" que envejecian solas y contradecian al mod. Lo que
# viene se sigue pidiendo por el bot de tickets, que es donde se decide.
#
# La licencia NO va por mod. Es la misma para los cuatro, y cuatro copias casi iguales terminaron
# divergiendo. Vive en /license/, enlazada desde el footer de todas las paginas.
#
# Only the feature-page block differs between mods. Labels are fixed too — it was
# "Installation"/"Getting Started" and "World Creation & Config"/"Configuration" across sections,
# which made the sidebar read as four unrelated sites. Keep a new mod's section to this shape.
#
# "Report a bug" es UNA sola pagina, arriba, fuera de los mods: el proceso es idéntico para los
# cuatro y tenerlo repetido garantizaba que divergieran — la copia de picnic todavía hablaba de los
# canales #bugs y #features, que ya no existen. Lo específico de cada mod vive en pestañas dentro
# de esa página.
