site_name: Modding Wiki
site_description: >-
  La wiki unica de todos los mods de Cobblemon de shiero — Routes, Nuzlocke, Picnic y Ditto HMs.
site_url: https://manucruzleiva.github.io/mod-wiki/
repo_url: https://github.com/manucruzleiva/mod-wiki
repo_name: manucruzleiva/mod-wiki
docs_dir: docs
copyright: 'Mods por shiero — "If you make money, I make money" license'

# Este repo construye SOLO la portada (la raiz del sitio). La wiki de cada mod la publica el
# repo de ese mod, en su propio subdirectorio de la rama gh-pages:
#
#   /            <- este repo          (landing)
#   /routes/     <- manucruzleiva/routes
#   /picnic/     <- manucruzleiva/cobblemon-picnic
#   /nuzlocke/   <- pendiente del split (#122)
#   /ditto-hms/  <- pendiente
#
# Por eso la nav de aca son links absolutos a esos subdirectorios y no paginas locales: mkdocs
# no conoce esos archivos, los deposita cada mod al deployar.

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: teal
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji
  - toc:
      permalink: true

nav:
  - Inicio: index.md
  - Cobblemon Routes: /mod-wiki/routes/
  - Cobblemon Picnic: /mod-wiki/picnic/
  - 💛 Sponsor shiero: https://github.com/sponsors/manucruzleiva

plugins:
  - search
