site_name: Modding Wiki
site_description: >-
  The single wiki for every Cobblemon mod by shiero — Routes, Nuzlocke & Soul Link, Picnic and Ditto HMs.
site_url: https://manucruzleiva.github.io/mod-wiki/
# Sin `repo_url` a proposito: Material lo dibuja en el header con el contador de estrellas y forks,
# que no le dice nada a quien viene a leer como se instala un mod. El repo queda enlazado solo desde
# el icono de GitHub del footer: la wiki NO invita a mandar PRs, las correcciones entran por Discord.
docs_dir: docs
copyright: 'Mods by shiero — "If you make money, I make money" license'

# The docs LIVE here — one site, one build, one repo.
#
# They used to live in each mod's repo and get deposited into a subdirectory of this repo's gh-pages
# branch by four separate workflows, each with its own deploy key. That is gone: the sources moved here,
# so there is a single mkdocs build and no cross-repo plumbing at all.
#
# It also matters that this repo is PUBLIC while every mod repo is private: the documentation stays
# openly readable and editable without exposing any code.

# The palette is `custom` on purpose: the colours are defined as CSS variables in
# stylesheets/extra.css, so light and dark are tuned as one system instead of being picked from
# Material's fixed swatches. Green/teal out of the box read like an untouched default.
theme:
  name: material
  custom_dir: overrides
  language: en
  icon:
    logo: material/map-marker-path
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  # Sin Google Fonts: `font: text/code` hace que Material pida un CSS a fonts.googleapis.com que
  # BLOQUEA el render, mas los woff2 de fonts.gstatic.com — Inter pedia ocho pesos. La pila del
  # sistema se ve bien, llega en cero requests, y de paso no manda a cada lector a Google.
  font: false
  features:
    # Four mods in one sidebar read as one endless list. Tabs give each mod its own top-level
    # entry, and the sidebar then only ever shows the section you are actually in.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    # Sin navigation.footer: los botones Anterior/Siguiente encadenan paginas que no se leen en
    # orden — de "License" a "Hardcore Nuzlocke" no hay ninguna continuidad. El indice de la
    # izquierda y el buscador ya cubren el moverse.
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips

extra:
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/SwcwXcCN4k
      name: Discord — support and bug reports
    - icon: simple/modrinth
      link: https://modrinth.com/user/shiero
      name: Modrinth
    - icon: simple/curseforge
      link: https://www.curseforge.com/members/shiero/projects
      name: CurseForge
    - icon: fontawesome/brands/github
      link: https://github.com/manucruzleiva/mod-wiki
      name: This wiki on GitHub
    - icon: fontawesome/solid/heart
      link: https://github.com/sponsors/manucruzleiva
      name: Sponsor shiero

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

# Every mod section follows the SAME spine, in this order:
#
#   index → Getting Started → (feature pages, mod-specific) → Commands → Configuration
#         → Roadmap → Community Credits → License
#
# Only the feature-page block differs between mods. Labels are fixed too — it was
# "Installation"/"Getting Started" and "World Creation & Config"/"Configuration" across sections,
# which made the sidebar read as four unrelated sites. Keep a new mod's section to this shape.
#
# "Report a bug" es UNA sola pagina, arriba, fuera de los mods: el proceso es idéntico para los
# cuatro y tenerlo repetido garantizaba que divergieran — la copia de picnic todavía hablaba de los
# canales #bugs y #features, que ya no existen. Lo específico de cada mod vive en pestañas dentro
# de esa página.
nav:
  - Home: index.md
  - Report a bug: reporting.md
  - Routes:
      - routes/index.md
      - Getting Started: routes/getting-started.md
      - Dynamic Routes: routes/routes.md
      - Map Integration: routes/map-integration.md
      - Items & Recipes: routes/items.md
      - Commands: routes/commands.md
      - Configuration: routes/configuration.md
      - Roadmap: routes/roadmap.md
      - Community Credits: routes/credits.md
      - License: routes/license.md
  - Cobblemon Nuzlocke & Soul Link:
      - nuzlocke/index.md
      - Hardcore Nuzlocke: nuzlocke/nuzlocke.md
      - Soul Link (co-op): nuzlocke/soul-link.md
      - Commands: nuzlocke/commands.md
      - Configuration: nuzlocke/configuration.md
      - Roadmap: nuzlocke/roadmap.md
      - Community Credits: nuzlocke/credits.md
      - License: nuzlocke/license.md
  - Cobblemon Picnic:
      - picnic/index.md
      - Getting Started: picnic/getting-started.md
      - Picnic Tables: picnic/picnic-tables.md
      - Spawn Re-rolling: picnic/spawn-rerolling.md
      - Shiny Aura: picnic/shiny-aura.md
      - Interactions & Items: picnic/interactions-and-items.md
      - Battle Seeker: picnic/battle-seeker.md
      - Commands: picnic/commands.md
      - Configuration: picnic/configuration.md
      - FAQ: picnic/faq.md
      - Roadmap: picnic/roadmap.md
      - Community Credits: picnic/credits.md
      - License: picnic/license.md
  - Cobblemon Ditto HMs:
      - ditto-hms/index.md
      - Getting Started: ditto-hms/getting-started.md
      - Active HMs: ditto-hms/abilities/active.md
      - Toggle HMs: ditto-hms/abilities/toggles.md
      - HM Case: ditto-hms/hm-case.md
      - Commands: ditto-hms/commands.md
      - Configuration: ditto-hms/configuration.md
      - Roadmap: ditto-hms/roadmap.md
      - Changelog: ditto-hms/changelog.md
      - Community Credits: ditto-hms/credits.md
      - License: ditto-hms/license.md
  - 💛 Sponsor shiero: https://github.com/sponsors/manucruzleiva

hooks:
  # Reemplaza cada ```mermaid por su SVG ya renderizado, para no mandarle a cada lector 3,4 MB de
  # Mermaid.js. Si un diagrama todavia no tiene SVG, deja el fence y el navegador lo dibuja como
  # siempre: nunca rompe el build, solo avisa cual falta.
  - hooks/prerender_mermaid.py

plugins:
  - search
  # Material se baja mermaid de unpkg.com en CADA pagina con diagrama — casi todas aca — y son ~1 MB
  # desde un tercero, sin version fija, o sea sin cache larga y a merced de que unpkg ande. `privacy`
  # lo descarga en tiempo de build y lo sirve desde el propio sitio: mismo origen, cacheable, y de
  # paso ningun lector pasa por un CDN ajeno.
  - privacy
