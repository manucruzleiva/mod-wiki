name: Wiki

# Builds the WHOLE wiki — every mod's docs live in this repo now — and publishes it to gh-pages.
#
# Before this, each mod repo built its own MkDocs site and deposited it into a subdirectory of this
# repo's gh-pages branch, using a deploy key per mod and peaceiris' destination_dir. That whole
# arrangement is gone: the docs moved here, so there is one build, one source of truth, and no
# cross-repo credentials at all.
#
# Consequently `keep_files` is NOT set any more. It existed only to stop the landing-page deploy from
# deleting the subdirectories the other repos had pushed. With one build producing the entire site, a
# clean replace is what we want — it is also what removes a page when it is deleted from docs/.
#
# Setup (already done): Settings -> Pages -> Source = "Deploy from a branch" -> gh-pages / (root).

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "overrides/**"
      - "mkdocs.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install mkdocs-material
      # --strict so a dangling internal link fails the build instead of shipping a broken page.
      - run: mkdocs build --strict

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          commit_message: "deploy wiki from ${{ github.sha }}"
