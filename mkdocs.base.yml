# Lo que comparten TODOS los sitios de la wiki: el de cada mod (mkdocs.<mod>.yml) y la landing
# (mkdocs.landing.yml). Cada uno lo trae con `INHERIT` y agrega su site_name, site_url, nav y
# exclude_docs. No se buildea solo: no tiene nav. Cada mod se publica versionado con mike bajo su
# propia carpeta, y la landing sin version en la raiz (.github/workflows/deploy.yml).
#
# Every mod's nav follows the SAME spine, in this order:
#
#   index → Getting Started → (feature pages, mod-specific) → Commands → Configuration
#         → Troubleshooting → Community Credits
#
# A mod whose commands and settings share one page calls it "Commands & Config". The index ends with
# a "## Get it" section holding `<!-- mod-spec -->` (hooks/mod_specs.py), and its hero carries
# `<!-- mod-badges -->`: neither is written by hand.
#
# Only the feature-page block differs between mods, and the labels are fixed too, so the sections
# read as one wiki and not as unrelated sites. Keep a new mod's nav to this shape. Sin Roadmap: las
# paginas de "lo que viene" envejecian solas y contradecian al mod; eso se pide por el bot de tickets.
# La licencia y "Report a bug" NO van por mod: son una sola pagina cada una, en la landing, porque
# las copias por mod terminaron divergiendo. Lo especifico de cada mod va en pestañas dentro de
# reporting.md.
#
# Las rutas relativas de este archivo (custom_dir, hooks) se resuelven desde el config HIJO, no
# desde este: por eso todos los configs viven en la raiz del repo y no en una carpeta.
#
# The docs live here, in a PUBLIC repo, while every mod repo is private: the documentation stays
# openly readable without exposing any code. Each mod is its own sub-site so it can be versioned
# on its own; they all keep `docs_dir: docs` so the ~300 relative links to docs/assets/ resolve
# unchanged, and drop what is not theirs with `exclude_docs`.

# Sin `repo_url` a proposito: Material lo dibuja en el header con el contador de estrellas y forks,
# que no le dice nada a quien viene a leer como se instala un mod. El repo no se enlaza en ningun
# lado: la wiki NO invita a mandar PRs, las correcciones entran por Discord.
docs_dir: docs
# The footer's only line, and the one place the license is linked from every page. It carries HTML on
# purpose: each mod used to repeat the same license page, four near-identical copies that drifted
# apart. There is now ONE at /license/, and this is how a reader reaches it from anywhere.
copyright: 'Mods by shiero — <a href="/mod-wiki/license/">"If you make money, I make money" license</a>'

# The palette is `custom` on purpose: the colours are defined as CSS variables in
# stylesheets/extra.css, so light and dark are tuned as one system instead of being picked from
# Material's fixed swatches. Green/teal out of the box read like an untouched default.
theme:
  name: material
  custom_dir: overrides
  language: en
  icon:
    logo: material/map-marker-path
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  # Sin Google Fonts: `font: text/code` hace que Material pida un CSS a fonts.googleapis.com que
  # BLOQUEA el render, mas los woff2 de fonts.gstatic.com — Inter pedia ocho pesos. La pila del
  # sistema se ve bien, llega en cero requests, y de paso no manda a cada lector a Google.
  font: false
  features:
    # Four mods in one sidebar read as one endless list. Tabs give each mod its own top-level
    # entry, and the sidebar then only ever shows the section you are actually in. `sticky` es lo
    # que mete overrides/partials/tabs.html dentro del header: ahi las secciones no son una fila,
    # son el menu hamburguesa de desktop.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    # Sin navigation.footer: los botones Anterior/Siguiente encadenan paginas que no se leen en
    # orden — de "License" a "Hardcore Nuzlocke" no hay ninguna continuidad. El indice de la
    # izquierda y el buscador ya cubren el moverse.
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips

extra:
  # Quita el "Made with Material for MkDocs" del footer. Lo unico que queda abajo es la linea de
  # licencia, que es la que el lector puede necesitar.
  generator: false
  # La version de cada mod que documenta su seccion. La clave es la carpeta bajo docs/; una pagina
  # cuya carpeta no esta aca (Home, Report a bug, License) no muestra ninguna. El numero es el del
  # ultimo GitHub Release del mod — el unico jar que un jugador puede tener — y se pone al dia en el
  # mismo commit en que se publica ese mod. Uno por seccion, nunca por pagina: una seccion describe
  # una sola version. Lo dibuja overrides/main.html arriba del titulo. El `name` es tambien la
  # entrada del mod en el menu de secciones de los sitios separados (overrides/partials/tabs.html).
  # `modrinth` es el id del proyecto en Modrinth, que no cambia si cambia el slug: con el,
  # modrinth-watch.yml abre un issue cuando Modrinth tiene un release que la seccion no describe, y la
  # linea "Documented against" avisa al lector. Un mod sin id no se vigila. Subir `version` sin tocar docs/<mod>/ falla en checks.yml
  # (tools/check_mod_versions.py): el numero se sube en el mismo cambio que reescribe las paginas.
  # Una entrada por linea, como estan: el script las lee con una regex.
  mod_versions:
    routes:         { name: Routes,                         version: 1.2.119, modrinth: PfmV1XPQ }
    nuzlocke:       { name: Cobblemon Nuzlocke & Soul Link, version: 1.5.38, modrinth: wHlszYZN }
    picnic:         { name: Cobblemon Picnic,               version: 4.0.0, modrinth: sfptxo0H }
    cobblemon-hms:  { name: Cobblemon HMs,                  version: 4.0.0, modrinth: JNfSyMuQ }
    raid-icons:     { name: Cobblemon Raid Icons,           version: 3.0.0, modrinth: S01tPZTk }
    champions:      { name: Cobblemon Champions Training,   version: 2.0.0, modrinth: PlTQXswh }
    tree-carve:     { name: Tree Carve,                     version: 2.0.0, modrinth: qkkteeJr }
    mid-battle-exp: { name: Cobblemon Mid-Battle EXP,       version: 2.1.0, modrinth: ShgrcSQY }
    poketowns:      { name: Cobblemon PokeTowns,            version: 0.0.11, modrinth: MjGKcXBb }
    action-combat:  { name: Cobblemon Action Combat,        version: 0.1.41 }
  # La ficha tecnica de cada mod: lo que dice su jar publicado (fabric.mod.json y neoforge.mods.toml
  # del tag del ultimo release), no lo que se recuerda. De aca salen, por hooks/mod_specs.py, las
  # insignias del hero de cada index, la tabla "Get it" de cada index, y en la portada los chips de
  # cada fila y la tabla de compatibilidad. Ninguna de esas se escribe a mano: se cambia aca, en el
  # mismo commit que sube `version` en mod_versions.
  #   minecraft   las versiones de Minecraft con jar propio.
  #   side        `client` si va solo en el cliente; sin la clave, va en el server y en cada cliente.
  #   cobblemon   el rango que corre, corto ("1.8+", "1.7–1.8"); sin la clave, no lo necesita.
  #   cobblemon_note  la aclaracion que va al lado en la ficha.
  #   requires    otros mods sin los que no arranca o no sirve, ademas del loader y sus librerias.
  #   fabric / neoforge   las librerias de cada loader.
  #   optional    [mod, para que] — lo que suma si esta.
  #   notes       filas extra de la tabla, {Titulo: texto}.
  #   curseforge  el id del proyecto en CurseForge, si tiene.
  #   unreleased  sin descarga publica todavia: la ficha no lleva fila "Download".
  # Los mods de las listas se nombran por la clave de `deps`, que lleva su nombre y su slug de Modrinth.
  deps:
    fabric-api:     { name: Fabric API,                  modrinth: fabric-api }
    flk:            { name: Fabric Language Kotlin,      modrinth: fabric-language-kotlin }
    kff:            { name: Kotlin for Forge,            modrinth: kotlin-for-forge }
    architectury:   { name: Architectury API,            modrinth: architectury-api }
    cloth-config:   { name: Cloth Config,                modrinth: cloth-config }
    modmenu:        { name: Mod Menu,                    modrinth: modmenu }
    routes:         { name: Routes,                      page: routes/index.md }
    poketowns:      { name: Cobblemon PokeTowns,         page: poketowns/index.md }
    raiddens:       { name: Cobblemon Raid Dens,         modrinth: cobblemonraiddens }
    xaero-minimap:  { name: Xaero's Minimap,             modrinth: xaeros-minimap }
    xaero-worldmap: { name: Xaero's World Map,           modrinth: xaeros-world-map }
    waystones:      { name: Waystones,                   modrinth: waystones }
    playerxp:       { name: "Cobblemon: PlayerXP",       modrinth: cobblemon-playerxp }
    cobbledollars:  { name: CobbleDollars,               modrinth: cobbledollars }
    rct:            { name: Radical Cobblemon Trainers,  modrinth: radical-cobblemon-trainers }
    mega-showdown:  { name: "Cobblemon: Mega Showdown",  modrinth: cobblemon-mega-showdown }
    pokebelt:       { name: PokeBelt,                    modrinth: pokebelt-cobblemon }
  mod_specs:
    routes:
      minecraft: "1.21.1"
      fabric: [fabric-api, architectury, cloth-config]
      neoforge: [architectury, cloth-config]
      optional:
        - [waystones, each waystone becomes a named town on the road network]
        - [xaero-minimap, "waypoints, trails and chunk paint on the map"]
      curseforge: 1584243
    nuzlocke:
      minecraft: "1.21.1"
      cobblemon: "1.7–1.8"
      cobblemon_note: "built for 1.8; it runs on 1.7.3, but [route Pokémon](nuzlocke.md#route-pokemon) need 1.8"
      requires: [routes]
      requires_note: 1.2.119 or newer
      fabric: [fabric-api, architectury, cloth-config]
      neoforge: [architectury, cloth-config]
      optional:
        - [rct, "trainers on the roads and level caps; without it those stand down"]
      curseforge: 1630816
    picnic:
      minecraft: "1.21.1"
      cobblemon: "1.8+"
      fabric: [architectury, flk]
      neoforge: [architectury, kff]
      optional:
        - [cloth-config, "the settings screen (with Mod Menu on Fabric)"]
      curseforge: 1581251
    cobblemon-hms:
      minecraft: "1.21.1"
      cobblemon: "1.8+"
      cobblemon_note: on 1.7.x it refuses to load with a dependency error, not a crash mid-session
      fabric: [flk, cloth-config]
      neoforge: [kff]
      optional:
        - [modmenu, "the settings screen, on Fabric"]
        - [cloth-config, "the settings screen, on NeoForge"]
      curseforge: 1587850
    raid-icons:
      minecraft: "1.21.1"
      side: client
      cobblemon_note: Cobblemon Raid Dens brings it with it
      requires: [raiddens]
      fabric: [fabric-api, flk]
      neoforge: [kff]
      optional:
        - [xaero-minimap, the icons on the minimap]
        - [xaero-worldmap, the icons on the world map]
        - [cloth-config, "the settings screen (with Mod Menu on Fabric)"]
    champions:
      minecraft: "1.21.1"
      cobblemon: "1.8"
      cobblemon_note: 1.7.3 is not supported
      fabric: [flk]
      neoforge: [kff]
      optional:
        - [playerxp, experience for the battles you win]
        - [cobbledollars, a second currency]
        - [cloth-config, "the settings screen (with Mod Menu on Fabric)"]
        - [poketowns, puts a Champions Trainer in every Pokémon Center]
      curseforge: 1676756
    tree-carve:
      minecraft: "1.21.1 · 26.1–26.3"
      fabric: [architectury, flk]
      neoforge: [architectury, kff]
      notes:
        Java: 21 for Minecraft 1.21.1, 25 for 26.x
        Works with: any mod that adds logs — it goes by the block tag, not by a list of woods
    mid-battle-exp:
      minecraft: "1.21.1"
      cobblemon: "1.7–1.8"
      cobblemon_note: the same jar runs on both
      fabric: [architectury, flk]
      neoforge: [architectury, kff]
      notes:
        Works with: any mod that changes how much EXP or how many EVs a battle gives — its numbers are the ones paid
    poketowns:
      unreleased: true
      minecraft: "1.21.1"
      cobblemon: "1.8+"
      requires: [cobbledollars, waystones]
      fabric: [fabric-api, flk, architectury]
      neoforge: [kff, architectury]
      optional:
        - [routes, connects every settlement to the road network]
    action-combat:
      unreleased: true
      minecraft: "1.21.1"
      cobblemon: "1.8+"
      fabric: [flk, architectury]
      neoforge: [kff, architectury]
      optional:
        - [mega-showdown, "Mega Evolution, Tera, Dynamax and Z-Moves in a real-time fight"]
        - [pokebelt, throwing Poké Balls mid-fight]
        - [rct, "its trainers fight in real time, and a win still counts"]
  # Como se encuentran los sitios separados entre si. Cada config de mod o de landing declara
  # `wiki_site` (la carpeta del mod, o `landing`). Lo leen hooks/cross_site_links.py, que reescribe
  # los links que salen del sitio, overrides/partials/tabs.html, que arma el menu de secciones, y
  # overrides/404.html, que manda una URL de antes de las versiones a `latest`.
  #   url    la raiz de la wiki publicada; la landing vive ahi y cada mod en <url><mod>/.
  #   alias  la version de un mod a la que apunta un link desde otro sitio (el alias de mike, #39).
  #   menu   el menu de secciones: `path` es una pagina de la landing, `url` un link externo, y
  #          `mods` es donde va un mod por entrada de mod_versions.
  wiki:
    url: https://manucruzleiva.github.io/mod-wiki/
    alias: latest
    # Carpetas de mods que cambiaron de nombre: overrides/404.html manda los links viejos a la nueva.
    moved:
      ditto-hms: cobblemon-hms
    menu:
      - { title: Home,         path: "" }
      - { title: Report a bug, path: reporting/ }
      - mods
      - { title: 💛 Sponsor shiero, url: https://github.com/sponsors/manucruzleiva }
  # El selector de versiones de Material. Lee `<mod>/versions.json`, el de mike para ese prefijo,
  # asi que cada mod lista solo sus versiones. La landing no versiona y lo apaga.
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/SwcwXcCN4k
      name: Discord — support and bug reports
    - icon: simple/modrinth
      link: https://modrinth.com/user/shiero
      name: Modrinth
    - icon: simple/curseforge
      link: https://www.curseforge.com/members/shiero/projects
      name: CurseForge
    - icon: fontawesome/solid/heart
      link: https://github.com/sponsors/manucruzleiva
      name: Sponsor shiero

extra_css:
  - assets/discs.css
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

hooks:
  # Las insignias, la tabla "Get it" de cada mod y la tabla de compatibilidad de la portada salen de
  # extra.mod_specs. Va antes de cross_site_links, que reescribe los links que deja.
  - hooks/mod_specs.py
  # Reemplaza cada ```mermaid por su SVG ya renderizado, para no mandarle a cada lector 3,4 MB de
  # Mermaid.js. Si un diagrama todavia no tiene SVG, deja el fence y el navegador lo dibuja como
  # siempre: nunca rompe el build, solo avisa cual falta.
  - hooks/prerender_mermaid.py
  # Un link a una pagina de otro sitio (otro mod, o la landing) apunta a ese sitio publicado en vez
  # de quedar roto, y cada sitio de mod recibe un index.html en su raiz. Ver el docstring.
  - hooks/cross_site_links.py

plugins:
  - search
  # Material se baja mermaid de unpkg.com en CADA pagina con diagrama — casi todas aca — y son ~1 MB
  # desde un tercero, sin version fija, o sea sin cache larga y a merced de que unpkg ande. `privacy`
  # lo descarga en tiempo de build y lo sirve desde el propio sitio: mismo origen, cacheable, y de
  # paso ningun lector pasa por un CDN ajeno.
  - privacy
  # Solo actua bajo `mike deploy`. El site_url de cada mod no lleva version (`…/<mod>/`), asi que sin
  # esto el canonical de cada pagina caeria en la version desplegada y no en `latest`, que es a donde
  # apuntan tambien los links entre sitios (extra.wiki.alias).
  - mike:
      canonical_version: latest
